name: Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and Deploy ASP.NET Core Backend
    runs-on: windows-latest

    steps:
      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # .NET SETUP
      # ============================================================

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info


      # ============================================================
      # RESTORE AND BUILD
      # ============================================================

      - name: Restore dependencies
        run: dotnet restore RccgHopeHouse.sln

      - name: Build solution
        run: dotnet build RccgHopeHouse.sln --configuration Release --no-restore


      # ============================================================
      # PUBLISH
      # ============================================================

      - name: Publish production API
        run: >
          dotnet publish src/RccgHopeHouse.Api/RccgHopeHouse.Api.csproj
          --configuration Release
          --runtime win-x86
          --self-contained true
          --output ./publish


      # ============================================================
      # BUILD ARTIFACT
      #
      # IMPORTANT:
      # Upload the artifact BEFORE injecting production secrets.
      # This prevents the API.Bible key from being stored inside
      # the GitHub Actions artifact.
      # ============================================================

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: rccg-hope-house-api
          path: ./publish
          if-no-files-found: error


      # ============================================================
      # PRODUCTION CONFIGURATION
      #
      # API.Bible authentication is configured locally using
      # .NET User Secrets. User Secrets are not deployed.
      #
      # In production the API key is supplied securely through
      # the API_BIBLE_KEY GitHub Actions repository secret.
      #
      # This step runs AFTER artifact upload so the GitHub artifact
      # remains free of production secrets.
      #
      # This step is skipped for pull requests because pull requests
      # are build/test operations and are not deployed.
      # ============================================================

      - name: Configure API.Bible production key
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
        run: |
          $configPath = ".\publish\appsettings.json"

          if (-not (Test-Path $configPath)) {
              throw "Published appsettings.json was not found at: $configPath"
          }

          if ([string]::IsNullOrWhiteSpace($env:API_BIBLE_KEY)) {
              throw "API_BIBLE_KEY GitHub secret is not configured."
          }

          Write-Host "Applying API.Bible production configuration..."

          $config = Get-Content $configPath -Raw | ConvertFrom-Json

          if ($null -eq $config.ApiBible) {
              throw "ApiBible configuration section was not found in appsettings.json."
          }

          $config.ApiBible.ApiKey = $env:API_BIBLE_KEY

          $config |
              ConvertTo-Json -Depth 100 |
              Set-Content $configPath -Encoding UTF8

          Write-Host "API.Bible production configuration applied successfully."


      # ============================================================
      # DEPLOY TO SMARTERASP.NET
      #
      # IMPORTANT:
      # wwwroot/uploads/gallery contains runtime user uploads.
      #
      # These files are NOT deployment artifacts and must survive
      # future deployments.
      #
      # Protection is provided in two ways:
      #
      # 1. DoNotDeleteRule prevents MSDeploy from deleting files
      #    simply because they are absent from the publish package.
      #
      # 2. The explicit skip rule excludes the gallery upload tree
      #    from deployment synchronisation altogether.
      #
      # The application itself remains responsible for creating,
      # replacing and deleting gallery images at runtime.
      # ============================================================

      - name: Deploy API to SmarterASP.NET
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          SMARTERASP_SITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SMARTERASP_SERVICE_URL: ${{ secrets.SERVER_COMPUTER_NAME }}
          SMARTERASP_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SMARTERASP_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          if (-not (Test-Path $msdeploy)) {
              throw "MSDeploy was not found at: $msdeploy"
          }

          $sourcePath = (Resolve-Path ".\publish").Path

          Write-Host "Deploying RCCG Hope House API..."
          Write-Host "Site: $env:SMARTERASP_SITE_NAME"
          Write-Host "Source: $sourcePath"
          Write-Host "Gallery runtime uploads will be preserved."

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$sourcePath" `
            -dest:contentPath="$env:SMARTERASP_SITE_NAME",computerName="$env:SMARTERASP_SERVICE_URL",userName="$env:SMARTERASP_USERNAME",password="$env:SMARTERASP_PASSWORD",authtype="Basic",includeAcls="False" `
            -allowUntrusted `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule `
            -skip:objectName=filePath,absolutePath=".*\\wwwroot\\uploads\\gallery\\.*" `
            -skip:objectName=dirPath,absolutePath=".*\\wwwroot\\uploads\\gallery($|\\.*)" `
            -verbose

          if ($LASTEXITCODE -ne 0) {
              throw "MSDeploy failed with exit code $LASTEXITCODE"
          }

          Write-Host "RCCG Hope House API deployment completed successfully."