name: Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and Deploy ASP.NET Core Backend
    runs-on: windows-latest

    steps:
      # Download the complete backend repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the .NET 10 SDK used by RCCG Hope House.
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Display SDK/runtime information for diagnostics.
      - name: Display .NET information
        run: dotnet --info

      # Restore all projects in the Clean Architecture solution.
      - name: Restore dependencies
        run: dotnet restore RccgHopeHouse.sln

      # Build the complete solution.
      - name: Build solution
        run: dotnet build RccgHopeHouse.sln --configuration Release --no-restore

      # Publish only the ASP.NET Core API.
      #
      # The SmarterASP.NET site uses a 32-bit application pool,
      # therefore we publish for win-x86.
      #
      # Self-contained publishing includes the required .NET runtime.
      - name: Publish production API
        run: >
          dotnet publish src/RccgHopeHouse.Api/RccgHopeHouse.Api.csproj
          --configuration Release
          --runtime win-x86
          --self-contained true
          --no-restore
          --output ./publish

      # Keep a copy of the exact production package generated by CI.
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: rccg-hope-house-api
          path: ./publish
          if-no-files-found: error

      # Deploy only when main is pushed or the workflow is manually run.
      # Pull requests are built and validated but are never deployed.
      - name: Deploy API to SmarterASP.NET
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          if (-not (Test-Path $msdeploy)) {
              throw "MSDeploy was not found at: $msdeploy"
          }

          $siteName = '${{ secrets.WEBSITE_NAME }}'
          $computer = '${{ secrets.SERVER_COMPUTER_NAME }}'
          $user     = '${{ secrets.SERVER_USERNAME }}'
          $password = '${{ secrets.SERVER_PASSWORD }}'

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$(Resolve-Path .\publish)" `
            -dest:contentPath="$siteName",ComputerName="$computer",UserName="$user",Password="$password",AuthType="Basic" `
            -allowUntrusted `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule

          if ($LASTEXITCODE -ne 0) {
              throw "MSDeploy failed with exit code $LASTEXITCODE"
          }