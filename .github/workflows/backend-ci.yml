name: Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and Deploy ASP.NET Core Backend
    runs-on: windows-latest

    steps:
      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # .NET SETUP
      # ============================================================

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info


      # ============================================================
      # RESTORE AND BUILD
      # ============================================================

      - name: Restore dependencies
        run: dotnet restore RccgHopeHouse.sln

      - name: Build solution
        run: dotnet build RccgHopeHouse.sln --configuration Release --no-restore


      # ============================================================
      # PUBLISH
      # ============================================================

      - name: Publish production API
        run: >
          dotnet publish src/RccgHopeHouse.Api/RccgHopeHouse.Api.csproj
          --configuration Release
          --runtime win-x86
          --self-contained true
          --output ./publish


      # ============================================================
      # BUILD ARTIFACT
      #
      # IMPORTANT:
      # Upload the artifact BEFORE injecting production secrets.
      #
      # This prevents connection strings, API keys and email
      # passwords from being stored inside the GitHub Actions
      # artifact.
      # ============================================================

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: rccg-hope-house-api
          path: ./publish
          if-no-files-found: error


      # ============================================================
      # PRODUCTION CONFIGURATION
      #
      # Sensitive configuration is stored locally using .NET User
      # Secrets during development. User Secrets are not deployed.
      #
      # In production, sensitive values are supplied securely through
      # GitHub Actions repository secrets.
      #
      # Required GitHub repository secrets:
      #
      # DEFAULT_CONNECTION
      # API_BIBLE_KEY
      # EMAIL_ADMIN_PASSWORD
      # EMAIL_INFO_PASSWORD
      # OPENAI_API_KEY
      # YOUTUBE_API_KEY
      #
      # OpenAI:Model remains in appsettings.json because the model
      # name is configuration rather than a secret.
      #
      # This step runs AFTER artifact upload so the GitHub artifact
      # remains free of production secrets.
      #
      # This step is skipped for pull requests because pull requests
      # are build/test operations and are not deployed.
      # ============================================================

      - name: Configure production secrets
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          DEFAULT_CONNECTION: ${{ secrets.DEFAULT_CONNECTION }}
          API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
          EMAIL_ADMIN_PASSWORD: ${{ secrets.EMAIL_ADMIN_PASSWORD }}
          EMAIL_INFO_PASSWORD: ${{ secrets.EMAIL_INFO_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          $configPath = ".\publish\appsettings.json"

          if (-not (Test-Path $configPath)) {
              throw "Published appsettings.json was not found at: $configPath"
          }

          # --------------------------------------------------------
          # Validate GitHub secrets
          # --------------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($env:DEFAULT_CONNECTION)) {
              throw "DEFAULT_CONNECTION GitHub secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($env:API_BIBLE_KEY)) {
              throw "API_BIBLE_KEY GitHub secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($env:EMAIL_ADMIN_PASSWORD)) {
              throw "EMAIL_ADMIN_PASSWORD GitHub secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($env:EMAIL_INFO_PASSWORD)) {
              throw "EMAIL_INFO_PASSWORD GitHub secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY)) {
              throw "OPENAI_API_KEY GitHub secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($env:YOUTUBE_API_KEY)) {
              throw "YOUTUBE_API_KEY GitHub secret is not configured."
          }

          Write-Host "Applying RCCG Hope House production configuration..."

          # --------------------------------------------------------
          # Load published appsettings.json
          # --------------------------------------------------------

          $config = Get-Content $configPath -Raw | ConvertFrom-Json

          # --------------------------------------------------------
          # Validate required configuration sections
          # --------------------------------------------------------

          if ($null -eq $config.ConnectionStrings) {
              throw "ConnectionStrings configuration section was not found in appsettings.json."
          }

          if ($null -eq $config.ApiBible) {
              throw "ApiBible configuration section was not found in appsettings.json."
          }

          if ($null -eq $config.EmailSettings) {
              throw "EmailSettings configuration section was not found in appsettings.json."
          }

          if ($null -eq $config.OpenAI) {
              throw "OpenAI configuration section was not found in appsettings.json."
          }

          if ($null -eq $config.YouTube) {
              throw "YouTube configuration section was not found in appsettings.json."
          }

          # --------------------------------------------------------
          # Database
          # --------------------------------------------------------

          $config.ConnectionStrings.DefaultConnection = $env:DEFAULT_CONNECTION

          # --------------------------------------------------------
          # API.Bible
          # --------------------------------------------------------

          $config.ApiBible.ApiKey = $env:API_BIBLE_KEY

          # --------------------------------------------------------
          # OpenAI
          #
          # Only the API key is injected here.
          # The configured model remains in appsettings.json.
          # --------------------------------------------------------

          $config.OpenAI.ApiKey = $env:OPENAI_API_KEY

          # --------------------------------------------------------
          # YouTube Data API
          # --------------------------------------------------------

          $config.YouTube.ApiKey = $env:YOUTUBE_API_KEY

          # --------------------------------------------------------
          # RCCG Hope House Email
          #
          # admin@rccghopehouse.org.uk
          #     System/account/admin emails
          #
          # info@rccghopehouse.org.uk
          #     Public correspondence/newsletters
          # --------------------------------------------------------

          $config.EmailSettings.AdminPassword = $env:EMAIL_ADMIN_PASSWORD
          $config.EmailSettings.InfoPassword = $env:EMAIL_INFO_PASSWORD

          # --------------------------------------------------------
          # Save production configuration
          # --------------------------------------------------------

          $config |
              ConvertTo-Json -Depth 100 |
              Set-Content $configPath -Encoding UTF8

          Write-Host "Production configuration applied successfully."
          Write-Host "Database connection string configured."
          Write-Host "API.Bible key configured."
          Write-Host "OpenAI API key configured."
          Write-Host "YouTube API key configured."
          Write-Host "Admin email credentials configured."
          Write-Host "Info email credentials configured."


      # ============================================================
      # DEPLOY TO SMARTERASP.NET
      #
      # IMPORTANT:
      #
      # The following directories contain runtime-generated data
      # and must survive future deployments:
      #
      # wwwroot/uploads/gallery
      #     Gallery photographs and generated thumbnails.
      #
      # logs
      #     Rolling Serilog application logs generated by the
      #     production API.
      #
      # These files are NOT deployment artifacts.
      #
      # Protection is provided in two ways:
      #
      # 1. DoNotDeleteRule prevents MSDeploy from deleting files
      #    simply because they are absent from the publish package.
      #
      # 2. Explicit skip rules exclude the runtime directories from
      #    deployment synchronisation altogether.
      #
      # The application remains responsible for managing files that
      # it creates in these directories at runtime.
      # ============================================================

      - name: Deploy API to SmarterASP.NET
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          SMARTERASP_SITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SMARTERASP_SERVICE_URL: ${{ secrets.SERVER_COMPUTER_NAME }}
          SMARTERASP_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SMARTERASP_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          if (-not (Test-Path $msdeploy)) {
              throw "MSDeploy was not found at: $msdeploy"
          }

          $sourcePath = (Resolve-Path ".\publish").Path

          Write-Host "Deploying RCCG Hope House API..."
          Write-Host "Site: $env:SMARTERASP_SITE_NAME"
          Write-Host "Source: $sourcePath"
          Write-Host "Gallery runtime uploads will be preserved."
          Write-Host "Application logs will be preserved."

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$sourcePath" `
            -dest:contentPath="$env:SMARTERASP_SITE_NAME",computerName="$env:SMARTERASP_SERVICE_URL",userName="$env:SMARTERASP_USERNAME",password="$env:SMARTERASP_PASSWORD",authtype="Basic",includeAcls="False" `
            -allowUntrusted `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule `
            -skip:objectName=filePath,absolutePath=".*\\wwwroot\\uploads\\gallery\\.*" `
            -skip:objectName=dirPath,absolutePath=".*\\wwwroot\\uploads\\gallery($|\\.*)" `
            -skip:objectName=filePath,absolutePath=".*\\logs\\.*" `
            -skip:objectName=dirPath,absolutePath=".*\\logs($|\\.*)" `
            -verbose

          if ($LASTEXITCODE -ne 0) {
              throw "MSDeploy failed with exit code $LASTEXITCODE"
          }

          Write-Host "RCCG Hope House API deployment completed successfully."