name: Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and Deploy ASP.NET Core Backend
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore RccgHopeHouse.sln

      - name: Build solution
        run: dotnet build RccgHopeHouse.sln --configuration Release --no-restore

      - name: Publish production API
        run: >
          dotnet publish src/RccgHopeHouse.Api/RccgHopeHouse.Api.csproj
          --configuration Release
          --runtime win-x86
          --self-contained true
          --output ./publish

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: rccg-hope-house-api
          path: ./publish
          if-no-files-found: error

      - name: Deploy API to SmarterASP.NET
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          SMARTERASP_SITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SMARTERASP_SERVICE_URL: ${{ secrets.SERVER_COMPUTER_NAME }}
          SMARTERASP_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SMARTERASP_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          if (-not (Test-Path $msdeploy)) {
              throw "MSDeploy was not found at: $msdeploy"
          }

          $sourcePath = (Resolve-Path ".\publish").Path

          Write-Host "Deploying RCCG Hope House API..."
          Write-Host "Site: $env:SMARTERASP_SITE_NAME"
          Write-Host "Source: $sourcePath"

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$sourcePath" `
            -dest:contentPath="$env:SMARTERASP_SITE_NAME",computerName="$env:SMARTERASP_SERVICE_URL",userName="$env:SMARTERASP_USERNAME",password="$env:SMARTERASP_PASSWORD",authtype="Basic",includeAcls="False" `
            -allowUntrusted `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule `
            -verbose

          if ($LASTEXITCODE -ne 0) {
              throw "MSDeploy failed with exit code $LASTEXITCODE"
          }

          Write-Host "RCCG Hope House API deployment completed successfully."